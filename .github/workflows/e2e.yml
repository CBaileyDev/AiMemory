name: E2E IDE Integration Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  e2e:
    name: e2e (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: npm install --ignore-scripts
        shell: bash

      - name: Run IDE integration e2e tests
        run: npm run test:e2e
        shell: bash

  dist-checks:
    name: Distribution hardening (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: npm install --ignore-scripts
        shell: bash

      - name: Version drift guard
        run: npm run check:versions
        shell: bash

      - name: Build
        run: npm run build
        shell: bash

      - name: Package size budget
        run: npm run check:size
        shell: bash

      - name: npm pack (produce tarball)
        id: pack
        run: |
          npm pack --pack-destination ./dist-pack
          ls -la ./dist-pack
        shell: bash

      - name: Smoke-install the tarball and run a trivial command
        run: |
          TARBALL=$(ls ./dist-pack/claude-mem-*.tgz | head -1)
          npm install -g "$TARBALL"
          claude-mem version
        shell: bash

  verification-matrix:
    name: Phase 10 matrix (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: npm install --ignore-scripts
        shell: bash

      - name: Run Phase 10 verification matrix
        run: npm run verify
        shell: bash
